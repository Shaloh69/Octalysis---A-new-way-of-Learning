# OCTA — local production-equivalent stack.
#
# There is no cloud project yet, so "production" runs here. The point is that the
# SAME db/schema.sql, the SAME policies, and the SAME denial tests run locally as
# will run on Supabase. db/local-bootstrap.sql supplies the auth schema and the
# three roles that Supabase would otherwise provide.
#
#   pnpm db:up      start Postgres
#   pnpm db:reset   drop, recreate, apply all four SQL files, run invariants
#   pnpm test       typecheck + unit + the RLS denial suite
#
# Ports are non-default on purpose so this never collides with a local Postgres
# or a `supabase start` stack on 54322.

services:
  db:
    image: postgres:16-alpine
    container_name: octa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: octa
      # Deterministic collation so ORDER BY in tests matches CI.
      LANG: C
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "54329:5432"
    volumes:
      - octa-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d octa"]
      interval: 3s
      timeout: 3s
      retries: 20
    command:
      - postgres
      # Surface slow policy evaluation early -- is_stage_unlocked() runs per row
      # inside an RLS policy, and the free Render instance has no headroom.
      - -c
      - log_min_duration_statement=200
      - -c
      - shared_preload_libraries=pg_stat_statements

volumes:
  octa-db-data:
