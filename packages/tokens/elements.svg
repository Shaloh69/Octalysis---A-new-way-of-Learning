<?xml version="1.0" encoding="UTF-8"?>
<!--
  OCTA — element sprite
  packages/tokens/elements.svg

  Use with <svg><use href="/elements.svg#octa-reg-pc"/></svg>
  Every symbol is stroke-based and inherits currentColor, so it
  themes for free. No colours are baked in.

  Sections:
    1. The register cast    (six characters, drawn from real notation)
    2. Stage node states    (locked / available / active / mastered)
    3. Depth gauge          (the 7-level hierarchy indicator)
    4. Subsystems           (what lights up on Bring-Up)
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!-- ========================================================
       1. THE REGISTER CAST
       Not mascots. Six units with distinct silhouettes, each
       drawn from how the thing is actually notated. By week 10
       a student recognises MAR by its shape, not its label.
       ======================================================== -->

  <!-- PC — Program Counter. Points to what's next. -->
  <symbol id="octa-reg-pc" viewBox="0 0 32 32">
    <title>Program Counter</title>
    <rect x="4" y="8" width="24" height="16" rx="2"
          fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M12 12l6 4-6 4" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M21 12v8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- IR — Instruction Register. Holds the instruction being run. -->
  <symbol id="octa-reg-ir" viewBox="0 0 32 32">
    <title>Instruction Register</title>
    <path d="M11 8H7a1 1 0 00-1 1v14a1 1 0 001 1h4M21 8h4a1 1 0 011 1v14a1 1 0 01-1 1h-4"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <rect x="13" y="13" width="6" height="6" fill="currentColor"/>
  </symbol>

  <!-- MAR — Memory Address Register. Which cell. A crosshair on a grid. -->
  <symbol id="octa-reg-mar" viewBox="0 0 32 32">
    <title>Memory Address Register</title>
    <rect x="6" y="6" width="20" height="20" rx="1"
          fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M16 6v20M6 16h20" stroke="currentColor" stroke-width="1" opacity="0.45"/>
    <rect x="17" y="17" width="8" height="8" fill="currentColor"/>
  </symbol>

  <!-- MBR — Memory Buffer Register. Data in transit. An open box. -->
  <symbol id="octa-reg-mbr" viewBox="0 0 32 32">
    <title>Memory Buffer Register</title>
    <path d="M6 12V9a1 1 0 011-1h18a1 1 0 011 1v3M6 20v3a1 1 0 001 1h18a1 1 0 001-1v-3"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M16 9v14M16 23l-3-3M16 23l3-3"
          fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- AC — Accumulator. Where the result lands. -->
  <symbol id="octa-reg-ac" viewBox="0 0 32 32">
    <title>Accumulator</title>
    <circle cx="16" cy="16" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M16 11v10M11 16h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- ALU — the standard trapezoid with the input notch. Real notation. -->
  <symbol id="octa-reg-alu" viewBox="0 0 32 32">
    <title>Arithmetic Logic Unit</title>
    <path d="M4 7l8 6-8 6V7z" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linejoin="round" opacity="0"/>
    <path d="M5 6h9l2 3 2-3h9l-5 20H10L5 6z"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <path d="M13 17h6M16 14v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- ========================================================
       2. STAGE NODE STATES
       Hexagons, because the stage map is a dependency graph and
       hexes tile without ambiguity about which node connects where.
       ======================================================== -->

  <symbol id="octa-node-locked" viewBox="0 0 40 40">
    <title>Locked stage</title>
    <path d="M20 3l14.7 8.5v17L20 37 5.3 28.5v-17L20 3z"
          fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-dasharray="3 3" opacity="0.55"/>
    <path d="M16.5 19v-2.5a3.5 3.5 0 017 0V19" fill="none"
          stroke="currentColor" stroke-width="1.8" opacity="0.75"/>
    <rect x="14.5" y="19" width="11" height="8" rx="1.5"
          fill="currentColor" opacity="0.75"/>
  </symbol>

  <symbol id="octa-node-available" viewBox="0 0 40 40">
    <title>Available stage</title>
    <path d="M20 3l14.7 8.5v17L20 37 5.3 28.5v-17L20 3z"
          fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="20" cy="20" r="3.5" fill="currentColor"/>
  </symbol>

  <symbol id="octa-node-active" viewBox="0 0 40 40">
    <title>Stage in progress</title>
    <path d="M20 3l14.7 8.5v17L20 37 5.3 28.5v-17L20 3z"
          fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.35"/>
    <!-- progress arc: set stroke-dashoffset from mastery, 0..75.4 -->
    <circle cx="20" cy="20" r="12" fill="none" stroke="currentColor"
            stroke-width="3" stroke-linecap="round"
            stroke-dasharray="75.4" stroke-dashoffset="37.7"
            transform="rotate(-90 20 20)"/>
  </symbol>

  <symbol id="octa-node-mastered" viewBox="0 0 40 40">
    <title>Stage mastered</title>
    <path d="M20 3l14.7 8.5v17L20 37 5.3 28.5v-17L20 3z"
          fill="currentColor" opacity="0.18"/>
    <path d="M20 3l14.7 8.5v17L20 37 5.3 28.5v-17L20 3z"
          fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M14 20.5l4.2 4.2L26.5 16" fill="none" stroke="currentColor"
          stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- ========================================================
       3. DEPTH GAUGE
       Seven strata, L6 at top to L0 at bottom. Set data-depth
       on the wrapper; CSS lights strata at or above it.
       ======================================================== -->
  <symbol id="octa-depth-gauge" viewBox="0 0 24 112">
    <title>Computer Level Hierarchy depth</title>
    <g stroke="currentColor" stroke-width="1.5" fill="none">
      <rect data-level="6" x="3" y="2"  width="18" height="12" rx="1.5"/>
      <rect data-level="5" x="3" y="17" width="18" height="12" rx="1.5"/>
      <rect data-level="4" x="3" y="32" width="18" height="12" rx="1.5"/>
      <rect data-level="3" x="3" y="47" width="18" height="12" rx="1.5"/>
      <rect data-level="2" x="3" y="62" width="18" height="12" rx="1.5"/>
      <rect data-level="1" x="3" y="77" width="18" height="12" rx="1.5"/>
      <rect data-level="0" x="3" y="92" width="18" height="12" rx="1.5"/>
    </g>
  </symbol>

  <!-- ========================================================
       4. SUBSYSTEMS — what lights up on Bring-Up
       ======================================================== -->

  <symbol id="octa-sys-power" viewBox="0 0 32 32">
    <title>Power rail</title>
    <path d="M18 4l-9 14h6l-1 10 9-14h-6l1-10z" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  </symbol>

  <symbol id="octa-sys-clock" viewBox="0 0 32 32">
    <title>Clock</title>
    <path d="M3 22V10h7v12h7V10h7v12h5" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  </symbol>

  <symbol id="octa-sys-bus" viewBox="0 0 32 32">
    <title>Data bus</title>
    <path d="M4 11h24M4 16h24M4 21h24" stroke="currentColor"
          stroke-width="2" stroke-linecap="round"/>
    <circle cx="11" cy="11" r="2.5" fill="currentColor"/>
    <circle cx="21" cy="16" r="2.5" fill="currentColor"/>
    <circle cx="14" cy="21" r="2.5" fill="currentColor"/>
  </symbol>

  <symbol id="octa-sys-memory" viewBox="0 0 32 32">
    <title>Main memory</title>
    <rect x="5" y="9" width="22" height="16" rx="1.5"
          fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M10 9V5M16 9V5M22 9V5M10 25v2M16 25v2M22 25v2"
          stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M10 14h12M10 18h12" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
  </symbol>

  <symbol id="octa-sys-cache" viewBox="0 0 32 32">
    <title>Cache tiers</title>
    <rect x="9"  y="5"  width="14" height="6" rx="1.5" fill="none"
          stroke="currentColor" stroke-width="2"/>
    <rect x="6"  y="13" width="20" height="6" rx="1.5" fill="none"
          stroke="currentColor" stroke-width="2" opacity="0.7"/>
    <rect x="3"  y="21" width="26" height="6" rx="1.5" fill="none"
          stroke="currentColor" stroke-width="2" opacity="0.45"/>
  </symbol>

  <symbol id="octa-sys-gate" viewBox="0 0 32 32">
    <title>Digital logic</title>
    <path d="M9 7h7a9 9 0 010 18H9V7z" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linejoin="round"/>
    <path d="M3 12h6M3 20h6M25 16h4" stroke="currentColor"
          stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <symbol id="octa-sys-control" viewBox="0 0 32 32">
    <title>Control unit</title>
    <rect x="7" y="7" width="18" height="18" rx="2" fill="none"
          stroke="currentColor" stroke-width="2"/>
    <path d="M12 13h8M12 16h8M12 19h5" stroke="currentColor"
          stroke-width="2" stroke-linecap="round"/>
    <path d="M16 2v5M16 25v5M2 16h5M25 16h5" stroke="currentColor"
          stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <symbol id="octa-sys-core" viewBox="0 0 32 32">
    <title>Processor core</title>
    <rect x="8" y="8" width="16" height="16" rx="2" fill="none"
          stroke="currentColor" stroke-width="2"/>
    <rect x="13" y="13" width="6" height="6" fill="currentColor"/>
    <path d="M12 2v6M20 2v6M12 24v6M20 24v6M2 12h6M2 20h6M24 12h6M24 20h6"
          stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

</svg>
