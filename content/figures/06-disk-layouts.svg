<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 270">
  <title>Two ways to lay out a disk surface</title>
  <desc>Two disks seen from above, each with six concentric tracks divided into sectors. Left, constant angular velocity: every track has the same 8 pie-shaped sectors, so a sector on an outer track is much longer than one on an inner track. Right, multiple zone recording, simplified: three zones of two tracks each, with 8, 12 and 16 sectors per track from the centre outwards, so sectors stay closer to the same length. One outer-track sector is shaded on each disk to compare their lengths.</desc>
