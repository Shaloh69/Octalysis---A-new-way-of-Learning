<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 190">
  <title>Minus 6.25 as a binary32 word, bit by bit</title>
  <desc>Thirty-two bit cells. The first is the sign, 1, so the number is negative. The next eight are the biased exponent, 1000 0001, which is 129; minus the bias of 127 that is 2. The last twenty-three are the fraction, 1001 followed by zeros; with the implied leading 1 the significand is 1.1001 in binary. So the value is minus 1.1001 binary times 2 to the 2, which is minus 110.01 binary, minus 6.25. In hexadecimal the word is C0C80000.</desc>
